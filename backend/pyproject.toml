[project]
name = "structured-learning-backend"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy[asyncio]>=2.0.44,<2.1",
  "psycopg[binary]>=3.2.12,<4",
  "alembic>=1.17,<2",
  "redis>=6.4,<8",
  "celery[redis]>=5.6,<6",
  "boto3>=1.40,<2",
  "email-validator>=2.3,<3",
  "argon2-cffi>=25,<26",
  "httpx>=0.28,<1",
  "cryptography>=46,<48",
  "jsonschema>=4.25,<5",
  "pillow>=12,<13",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
    "aiosqlite>=0.21,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
