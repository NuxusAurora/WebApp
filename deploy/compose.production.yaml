# Overlay on ../compose.yaml; Docker Compose >= 2.24.4.
x-log: &bounded-log
  driver: json-file
  options: {max-size: 10m, max-file: '3'}

services:
  postgres:
    logging: *bounded-log
  redis:
    logging: *bounded-log
  storage:
    ports: !reset []
    logging: *bounded-log
  backend:
    ports: !reset []
    environment:
      COOKIE_SECURE: 'true'
      TEST_LOGIN_ENABLED: ${TEST_LOGIN_ENABLED:-false}
      TEST_LOGIN_PUBLIC_ORIGIN: ${TEST_LOGIN_PUBLIC_ORIGIN:-}
      PUBLIC_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      STORAGE_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN:?Set STORAGE_DOMAIN}
    logging: *bounded-log
  worker:
    healthcheck:
      interval: 15s
      timeout: 15s
      start_period: 30s
    environment:
      COOKIE_SECURE: 'true'
      TEST_LOGIN_ENABLED: ${TEST_LOGIN_ENABLED:-false}
      TEST_LOGIN_PUBLIC_ORIGIN: ${TEST_LOGIN_PUBLIC_ORIGIN:-}
      PUBLIC_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      STORAGE_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN:?Set STORAGE_DOMAIN}
    logging: *bounded-log
  frontend:
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_TEST_LOGIN_ENABLED: ${TEST_LOGIN_ENABLED:-false}
    environment:
      ACCOUNT_NOTICE: ${ACCOUNT_NOTICE:-}
    logging: *bounded-log
  proxy:
    profiles: [app]
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?Set STORAGE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [app, storage-access]
    depends_on:
      frontend: {condition: service_healthy}
      storage: {condition: service_healthy}
    restart: unless-stopped
    logging: *bounded-log

volumes:
  caddy-data: {}
  caddy-config: {}
